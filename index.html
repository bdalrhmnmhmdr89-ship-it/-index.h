<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ستوديو حرف: كل خدمات التصميم والشعارات والكتابة والتنسيق والمواقع</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aur" aria-hidden="true"><i></i><i></i></div>
<header><div class="pill"><a class="brand" href="#top">حرف</a><a class="btn sm" href="#contact">أرسل طلبك</a></div></header>

<main id="top">
<div class="wrap hero">
  <h1>كل ما يحتاجه مشروعك في مكان واحد</h1>
  <p id="hp"></p>
</div>

<div class="wrap">
  <h2 style="margin-bottom:12px">اختر ما تحتاجه</h2>
  <div class="tabs" id="tabs" role="group" aria-label="المجالات"></div>
  <section class="glass panel" id="panel" aria-live="polite"></section>
</div>

<div class="wrap contact" id="contact">
  <div><h2>طلبك</h2><p class="lead">الخدمات التي اخترتها ستظهر هنا وتُرسل مع رسالتك.</p><ul class="sum" id="sum"></ul></div>
  <form id="f" class="glass">
    <label>الاسم<input id="n" type="text" required autocomplete="name"></label>
    <label>تفاصيل المشروع<textarea id="d" rows="4" placeholder="نوع النشاط، الموعد المطلوب، أي أفكار لديك"></textarea></label>
    <button class="btn" type="button" data-t="0">أرسل للشعارات والتصاميم</button><button class="btn" type="button" data-t="1">أرسل للكتابة والتنسيق والمواقع</button><p class="empty" style="margin:0">كل زر يرسل الخدمات المختارة من مجالاته فقط إلى الرقم المسؤول عنها على واتساب.</p>
  </form>
</div>
</main>
<footer>© حرف، ستوديو شعارات وتصميم وكتابة وتنسيق ومواقع.</footer>
<div id="bar" class="glass" role="status"><b id="cnt"></b><a class="btn sm" href="#contact">راجع الطلب</a></div>

<script src="script.js"></script>
</body>
</html>
